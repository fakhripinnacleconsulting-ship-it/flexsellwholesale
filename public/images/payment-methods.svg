<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 80" width="720" height="80" fill="none">
  <!-- White Background Container for Pristine Visibility on All Themes -->
  <rect width="720" height="80" rx="12" fill="#FFFFFF" />

  <!-- VISA -->
  <g transform="translate(15, 18)">
    <path fill="#00579F" d="M52 44h9.5l6-36.5h-9.5L52 44zM38.5 18.5c-2.5-1-6.5-2.1-11.5-2.1-12.5 0-21.3 6.6-21.4 16-0.1 7 6.3 10.8 11.1 13.2 5 2.4 6.6 4 6.6 6.1 0 3.3-4 4.8-7.6 4.8-5.1 0-7.8-0.8-12-2.5l-1.6-0.8-1.8 11c4.6 2.1 13.2 3.9 19.3 4 13.4 0 22.1-6.6 22.2-16.8 0.1-5.6-3.4-9.9-10.8-13.4-4.5-2.3-7.3-3.9-7.3-6.2 0-2.1 2.4-4.3 7.5-4.3 4.3-0.1 7.5 0.9 9.9 2l1.2 0.6 1.7-11.4zM101.4 7.5h-7.4c-2.3 0-4.1 0.7-5.1 3L72.2 44h10s1.6-4.5 2-5.5h12.2c0.3 1.3 1.2 5.5 1.2 5.5h8.8L101.4 7.5zm-14.5 23.2c0.8-2.2 3.8-10.6 3.8-10.6s0.8-2.1 1.3-3.4l0.7 3.3 2.2 10.7h-8zM16.1 7.5L6.2 32.4c-0.6 2.6-2.8 4.3-5.3 4.5L0 37.4l0.4 2.3 15.3 0.1c2.6 0 4.6-1.8 5.2-4.3L27.3 7.5H16.1z"/>
    <path fill="#FAA61A" d="M16.1 7.5L6.2 32.4c-0.6 2.6-2.8 4.3-5.3 4.5L0 37.4l0.4 2.3 7.9 0.1c2.6 0 4.6-1.8 5.2-4.3L19.6 7.5h-3.5z"/>
  </g>

  <!-- Mastercard -->
  <g transform="translate(170, 8)">
    <circle cx="28" cy="27" r="22" fill="#EB001B"/>
    <circle cx="52" cy="27" r="22" fill="#F79E1B" fill-opacity="0.92"/>
    <text x="40" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="12" fill="#0F172A" text-anchor="middle" letter-spacing="-0.3">mastercard</text>
  </g>

  <!-- Google Pay (G Pay) -->
  <g transform="translate(295, 18)">
    <path fill="#4285F4" d="M21 21.5c0-1.4-0.1-2.8-0.4-4.1H0v8.1h11.8c-0.5 2.8-2.1 5.2-4.5 6.8v5.6h7.3c4.2-3.9 6.7-9.7 6.7-16.4z"/>
    <path fill="#34A853" d="M0 42.9c5.8 0 10.7-1.9 14.3-5.2l-7.3-5.6c-1.9 1.3-4.4 2.1-7 2.1-5.4 0-10.1-3.7-11.8-8.6h-7.5v5.8C-15.7 38.6-8.3 42.9 0 42.9z"/>
    <path fill="#FBBC05" d="M-11.8 25.6c-0.4-1.3-0.7-2.8-0.7-4.2s0.3-2.9 0.7-4.2v-5.8h-7.5c-1.6 3.1-2.4 6.4-2.4 10s0.9 6.9 2.4 10l7.5-5.8z"/>
    <path fill="#EA4335" d="M0 8.7c3.1 0 6 1.1 8.2 3.1l6.1-6.1C10.7 2.3 5.8 0 0 0 -8.3 0-15.7 4.3-19.3 11.4l7.5 5.8C-10.1 12.4-5.4 8.7 0 8.7z"/>
    <text x="32" y="30" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="32" fill="#202124">Pay</text>
  </g>

  <!-- UPI -->
  <g transform="translate(460, 18)">
    <text x="0" y="30" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-style="italic" font-size="32" fill="#475569" letter-spacing="1">UPI</text>
    <path fill="#F97316" d="M60 6 l9 13 h-7 l-9 -13 z"/>
    <path fill="#10B981" d="M62 19 l9 13 h-7 l-9 -13 z"/>
    <text x="-2" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-style="italic" font-size="7.5" fill="#334155" letter-spacing="0.5">UNIFIED PAYMENTS INTERFACE</text>
  </g>

  <!-- CASH ON DELIVERY -->
  <g transform="translate(605, 8)">
    <!-- Yellow Top Badge -->
    <path fill="#FFC107" d="M14 2 h50 l-7 16 h-50 z"/>
    <text x="39" y="13" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="10" fill="#000000" text-anchor="middle">CASH ON</text>
    <line x1="8" y1="7" x2="14" y2="7" stroke="#000" stroke-width="1.8"/>
    <line x1="6" y1="11" x2="12" y2="11" stroke="#000" stroke-width="1.8"/>

    <!-- Red Main Banner -->
    <path fill="#EE2C24" d="M5 18 h68 l-10 25 h-68 z" rx="4"/>
    <!-- Speed Lines -->
    <line x1="-1" y1="24" x2="10" y2="24" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="-4" y1="30" x2="8" y2="30" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="36" x2="7" y2="36" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
    <text x="39" y="36" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" fill="#FFFFFF" text-anchor="middle">DELIVERY</text>

    <!-- Black Truck Body -->
    <path fill="#000000" d="M17 43 h60 l-7 17 h-53 z"/>
    <!-- Coin Wheels -->
    <circle cx="29" cy="60" r="8" fill="#F59E0B" stroke="#B45309" stroke-width="1.2"/>
    <text x="29" y="63" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="9" fill="#FFF" text-anchor="middle">$</text>
    <circle cx="65" cy="60" r="8" fill="#F59E0B" stroke="#B45309" stroke-width="1.2"/>
    <text x="65" y="63" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="9" fill="#FFF" text-anchor="middle">$</text>
  </g>
</svg>
